 dodd_city_of_ishyaga_modifier_desc:0 ""
 dodd_land_reclamation_modifier_title:0 "Land reclaimed"
 dodd_land_reclamation_modifier_desc:0 "Massive swathes off land in this province have been drained of water."
 dodd_super_fertilizer_agriculture_modifier_title:0 "Heavy fertilizer use"
 dodd_super_fertilizer_agriculture_modifier_desc:0 "We use massive amounts of ash fertilizer for agricultural purposes in this province, boosting output tremendously."
 dodd_tree_plantations_modifier_title:0 "Tree plantation"
 dodd_tree_plantations_modifier_desc:0 "This province is part of a network of tree plantations that are used to produce lumber for shipmaking."
 dodd_merchant_navy_modifier_title:0 "Merchant navy"
 dodd_merchant_navy_modifier_desc:0 "We have a massive merchant navy capable of transporting our products to whereever we want them."
 dodd_a_mighty_fleet_modifier_title:0 "Mighty fleet"
 dodd_a_mighty_fleet_modifier_desc:0 "The might of our fleet is neigh unparraled."
 dodd_the_triple_city_title:0 "The Triple City"
 dodd_the_triple_city_desc:0 "This enormous city spans an entire archipelago three provinces in size."
 polder_gnomes_recruiting_irregulars_modifier_title:0 "Gnomes recruiting irregulars"
 polder_gnomes_recruiting_irregulars_modifier_desc:0 "Our gnomish allies are recruiting irregulars from our tribe to fight for them."
 dodd_gnomes_recruiting_irregulars_modifier_title:0 "Recruiting irregular"
 dodd_gnomes_recruiting_irregulars_modifier_desc:0 "We are recruiting irregulars from the polder to bolster our army."
 dodd_the_three_polders_modifier_title:0 "Mercenaries from the polder"
 dodd_the_three_polders_modifier_desc:0 "Our arrangement with the poldertribes is ultimately simple they provide us with soldiers and we provide them with weapons."
 dodd_growing_polder_modifier_title:0 "A growing polder"
 dodd_growing_polder_modifier_desc:0 "Our tribe is growing rapidly with the support of the Mangrove Gnomes."
 dodd_the_five_polders_modifier_title:0 "Five polders"
 dodd_the_five_polders_modifier_desc:0 "Our generale polder continues to expand with there now being five proper poldertribes under us. Luckily our administration is growing to keep up with it and our diplomats are ever more capable of keeping them in line."
 dodd_closer_with_lizardfolk_modifier_title:0 "Closer polderties"
 dodd_closer_with_lizardfolk_modifier_desc:0 "Our fledgling polder is becoming a more cohesive unit."
 polder_closer_with_gnomes_modifier_title:0 "Close ties with gnomes"
 polder_closer_with_gnomes_modifier_desc:0 "The gnomes provide many of our warriors with guns as well as constant employment."
 dodd_subjugating_lizard_folk_modifier_title:0 "Subjugation campaigns"
 dodd_subjugating_lizard_folk_modifier_desc:0 "Our polder has succesfully subjugated the tribes of the Mashkay and Skarakara lizardfolk, leading to an influx of new labourers and warriors to the Doddcodds."
 dodd_expeditions_modifier_title:0 "Organizing expeditions"
 dodd_expeditions_modifier_desc:0 "Our Hierarchy has decided on organizing expeditions into Ardimya following rumours off relics from the old genie civilizations being found there."
 dodd_genie_relics_modifier_title:0 "Genie relics"
 dodd_genie_relics_modifier_desc:0 "The Mangrove gnomes found genie relics in this province and have set out to study them."
 dodd_taychend_imports_modifier_title:0 "Taychendi products"
 dodd_taychend_imports_modifier_desc:0 "The influx of luxury and magical products from Taychend have greatly increased the wealth and quality of life of our artificers."
 dodd_taste_for_more_modifier_title:0 "Taste for more"
 dodd_taste_for_more_modifier_desc:0 "Our recent aquisitions in Eordand have proven most profitable, inspiring us to go for even more."
 dodd_rakaty_trade_centre_modifier_title:0 "Rankaty centre of trade"
 dodd_rakaty_trade_centre_modifier_desc:0 "This province has been designated as the main supply port for ships travelling between east and west Sarhal by the Mangrove Gnome Hierarchy, as well as ships heading to Aelantir."
 dodd_colonization_modifier_title:0 "Colonization effort"
 dodd_colonization_modifier_desc:0 "With the establishment of supply ports in the rankaty islands the Doddcodds can now focus their efforts on colonization of far away places."
 dodd_colonial_development_effort_modifier_title:0 "Development Effort"
 dodd_colonial_development_effort_modifier_desc:0 "Our fledgling colony has aquired a wide range of lands, now it is time to put said lands to good use."
 dodd_wood_influx_modifier_title:0 "Wood influx"
 dodd_wood_influx_modifier_desc:0 "The Effelai is full of tall trees, perfect for shipbuilding. Our colonists have thus taken to chopping these trees and selling them to our shipbuilders, reducing production costs."
 dodd_well_developed_deep_effelai_colony_modifier_title:0 "Central Effelai cities"
 dodd_well_developed_deep_effelai_colony_modifier_desc:0 "Our great hierarchy is capable of setting up cities even at the core of the wild Effelai, from here we recieve a variety of goods for our markets, as well as customers for our other goods."
 dodd_well_developed_colony_modifier_title:0 "Well developed colony"
 dodd_well_developed_colony_modifier_desc:0 "Our colony has been properly developed and even urbanized allowing us to set up a domestic manufactoring base."
 dodd_well_developed_eastern_effelai_colony_modifier_title:0 "A flourishing effelai colony"
 dodd_well_developed_eastern_effelai_colony_modifier_desc:0 "Our colony in the Effelai is flourishing showing that the greatness of our hierarchy transcends continents as well as bolstering our internal trade."
 dodd_irregular_recruitment_spree_title:0 "Irregulars recruitment spree"
 dodd_irregular_recruitment_spree_desc:0 "We are recruiting massive number of irregular troops to quickly bolster our numbers."
 dodd_dykes_build_modifier_title:0 "Dykes"
 dodd_dykes_build_modifier_desc:0 "This province has a system of dykes to manage water levels."
 dodd_pumps_installed_modifier_title:0 "Gemalen"
 dodd_pumps_installed_modifier_desc:0 "This province is home to a set off pumps called gemalen, to be used to drain the water away."
 dodd_limited_gnomes_in_army_modifier_title:0 "Limited gnomes in army"
 dodd_limited_gnomes_in_army_modifier_desc:0 "Our army has but a small number of gnomes, depending instead on lizardfolk mercenaries."
 dodd_lizardfolk_in_navy_modifier_title:0 "Lizardfolk in the navy"
 dodd_lizardfolk_in_navy_modifier_desc:0 "We have allowed lizardfolk to sign up as sailors for our mighty fleet."
 dodd_army_left_out_to_dry_modifier_title:0 "Army left out to dry"
 dodd_army_left_out_to_dry_modifier_desc:0 "Our Hierarchy has decided to ignore the needs of our army providing it with nearly no resources."
 dodd_quality_over_quantity_modifier_title:0 "Small in number, great in combat"
 dodd_quality_over_quantity_modifier_desc:0 "Lacking manpower we have turned to turning our men into the best men any men could be."
 dodd_gnomish_officers_modifier_title:0 "Gnomish officers"
 dodd_gnomish_officers_modifier_desc:0 "Gnomish officers specialize at maximizing the effectivness of our ranged weapons."
 dodd_gnomish_gnomish_elite_core_modifier_title:0 "Gnomish Elites"
 dodd_gnomish_gnomish_elite_core_modifier_desc:0 "Our army is strengthened by a core of Gnomish elite soldiers."
 dodd_gnomish_gnomish_elite_core_modifier2_title:0 "Gnomish elites"
 dodd_gnomish_gnomish_elite_core_modifier2_desc:0 ""
 dodd_lizardfolk_in_army_modifier_title:0 "An army of two peoples"
 dodd_lizardfolk_in_army_modifier_desc:0 "In addition to crafty gnomes our army is home to crafty lizardfolk."
 dodd_lizardfolk_navy_modifier_title:0 "Lizardfolk navy"
 dodd_lizardfolk_navy_modifier_desc:0 "Though our captains remain gnomish the vast majority of the crews of our ships are lizardfolk."
 dodd_gnomes_free_for_civil_affairs_modifier_title:0 "Gnomish civil servants"
 dodd_gnomes_free_for_civil_affairs_modifier_desc:0 "With the lizardfolk taking care of the martial side of things our gnomish citizens are free to focus on other matters, such as running the government."
 dodd_gnomish_captains_title:0 "Gnomish captains"
 dodd_gnomish_captains_desc:0 "Though our military mostly consist of lizardfolk now the ones in charge of our ships remain gnomes and they have proven most effective at cannoneering."
 dodd_gnomes_free_for_civil_affairs_modifier_2_title:0 "Gnomish civil servants"
 dodd_gnomes_free_for_civil_affairs_modifier_2_desc:0 "With the lizardfolk taking care of the martial side of things our gnomish citizens are free to focus on other matters, such as running the government."
 dodd_lizardfolk_marines_modifier_title:0 "Lizardfolk marines"
 dodd_lizardfolk_marines_modifier_desc:0 "Our marines are proud lizardfolk warriors."
 dodd_lizardfolk_marines_modifier2_title:0 "Lizardfolk marines"
 dodd_lizardfolk_marines_modifier2_desc:0 ""
 dodd_mixed_marines_modifier_title:0 "Marine army"
 dodd_mixed_marines_modifier_desc:0 ""
 
 
 
 