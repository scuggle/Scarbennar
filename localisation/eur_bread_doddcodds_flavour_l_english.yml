 dodd_flavour_events.6.t:0 "Soil depletion"
 dodd_flavour_events.6.d:0 "With no more fertilizer our intensive farming practices have resulted in severe soil depletion."
 dodd_flavour_events.6.a:0 "Awful news"
 dodd_flavour_events.7.t:0 "Pluriculture agriculture"
 dodd_flavour_events.7.d:0 "Our farmers have adapated to a lack of agriculture, setting up a pluricultral agriculture system preventing soil depletion whilst increasing their variety of produce."
 dodd_flavour_events.7.a:0 "Great news!"
 dodd_flavour_events.8.t:0 "To few gnomes"
 dodd_flavour_events.8.d:0 "When we fled the dragoncoast our fleet had only a little over ten-thousand gnomes with it. As such when we landed in these exotic lands we found ourselves outnumbered by the native lizardfolk. This is why we settled down on the Doddcodds just off the coast, relying on our navy and an intricate network of alliances to protect ourselves. \n Now as we expand our hold in these lands we are increasingly running into staffing issues for both our army and our navy. We need to find solutions for these issues lest we find ourselves unable to defend ourselves."
 dodd_flavour_events.8.a:0 "Recruit lizardfolk mercenaries for the army."
 dodd_flavour_events.8.b:0 "Invite lizardfolk sailors."
 dodd_flavour_events.8.c:0 "Ignore the army."
 dodd_flavour_events.8.dd:0 "Build an elite but small army."
 dodd_flavour_events.9.t:0 "Army reforms."
 dodd_flavour_events.9.d:0 "As time goes on there is an increasing push to move away from an army of irregulars. Now that we finally have a sufficient manpower pool to recruit from it is time for drastic military reforms. But what sort of army should we strive for?"
 dodd_flavour_events.9.a:0 "Lizardfolk soldiers with gnomish officers."
 dodd_flavour_events.9.b:0 "An army of both lizardfolk and gnomes."
 dodd_flavour_events.9.c:0 "A fully lizardfolk army."
 dodd_flavour_events.9.dd:0 "An amphibious army."
 dodd_flavour_events.9.e:0 "Let us continue to focus on our navy instead."
 dodd_flavour_events.9.f:0 "An army of mercenaries in permanent employ."
 dodd_foundry_expansions_title:0 "Foundry expansions"
 dodd_foundry_expansions_desc:0 "The foundries of the Doddcodds have been greatly expanded, resulting in higher quality and quantity products."
 dodd_grand_foundry_modifier_title:0 "Grand foundry"
 dodd_grand_foundry_modifier_desc:0 "Our grand foundry at the capital produces cannons."
 dodd_buzzin_capital_modifier_title:0 "A bustling capital"
 dodd_buzzin_capital_modifier_desc:0 ""
 dodd_city_planning_modifier_title:0 "City planning"
 dodd_city_planning_modifier_desc:0 "We have become experts in city planning allowing us to grow our urban centres to greater heights."
 dodd_city_of_qasri_abeesooyinka_modifier_title:0 "City of Qasri Abeesooyinka"
 dodd_city_of_qasri_abeesooyinka_modifier_desc:0 ""
