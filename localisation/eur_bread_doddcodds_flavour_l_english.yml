 dodd_flavour_events.4.t:0 "Forced tree plantatations"
 dodd_flavour_events.4.d:0 "The gnomes from the Doddcodds have decided we have to turn one of our provinces in a tree plantatation. A move our people consider to be a rather significant overreach, will we let them force this through?"
 dodd_flavour_events.4.a:0 "It is for the best of all involved (our people may disagree and revolt)"
 dodd_flavour_events.4.b:0 "We will not stand for this!"
 dodd_flavour_events.5.t:0 "Tree plantations"
 dodd_flavour_events.5.d:0 "What province do we want to start a tree plantation in?"
 dodd_flavour_events.5.a:0 "None of these"
