l_english:
 dodd_expanding_the_foundries_title:0 "Expanding the foundries"
 dodd_expanding_the_foundries_desc:0 "The great foundries at the Doddcodds form the main pillar of our Hierarchy. If the Hierarchy is to thrive we must expand the foundries."
 dodd_a_worthy_capital_title:0 "A gnomish city"
 dodd_a_worthy_capital_desc:0 "Abscodda is the last gnomish city, though it is but a pale immitation of Oddansbay. Let us set out to rectify this as an early move towards building a new Hierarchy."
 dodd_the_seven_cities_title:0 "The seven cities"
 dodd_the_seven_cities_desc:0 "As time passes there are seven cities within our generale hierarchy who increasingly stand out, apart from our capital that is. This cities are: \n Qasri Abeesooyinka the city of sails \n Nazhni the city of bazaars \n Gokadas Soro the city of warriors /n Kethenkad city of gems \n Khatynsek the city of \n Yasa the city of mercenaries \n Ishyaga the city of scholars"
 dodd_land_reclamation_title:0 "Land reclamation"
 dodd_land_reclamation_desc:0 "Our small hierarchy is full of swamps right in its heartland. Long has the dominance of the water hindered our efficiency. Luckily we have now found new techniques to remove the water's dominance, though it will be a costly affair."
 dodd_dusty_fertilizer_title:0 "wip"
 dodd_dusty_fertilizer_desc:0 "wip"
 dodd_tree_plantations_title:0 "Tree plantations"
 dodd_tree_plantations_desc:0 "Our mighty fleet is what ensures our safety, yet we struggle to maintain due to the lack of proper timber in these lands. Let us ensure we can always build more ships by growing timber specifically for the fleet."
 dodd_a_merchant_navy_title:0 "Merchant navy"
 dodd_a_merchant_navy_desc:0 "We are a nation fueled by trade and as such we have a lot of goods to move around, most often via the water."
 dodd_mighty_fleet_title:0 "A mighty warfleet"
 dodd_mighty_fleet_desc:0 "In order to continue to ensure our safety in a changing world we need to invest further into our navy and create a neigh invicible warfleet."
 dodd_the_triple_city_title:0 "The triple city"
 dodd_the_triple_city_desc:0 "Doddcodds isn't simply the name of a city it is the name of a chain of islands within which we build our evergrowing capital. Now this capital is growing to large for just the core of the chain, expanding all over it fusing together with the cities of Khetenkad and Mubfadoja."
 dodd_an_irregular_army_title:0 "An irregular army"
 dodd_an_irregular_army_desc:0 "Our fletchling hierarchy has but a small gnomish population, infact we may very well have more lizardfolk subjects than gnomes. With such a small number of gnomes it would be difficult to build a proper armywith just gnomes, irresponsible even if we are to restore the Gnomish Hierarchy. Assuch our hierarchy has relied on Lizardfolk tribes for military power for a long time now, but simple allies and some mercenaries no longer sufficies, we need MORE."
 dodd_lizardkin_regulars_title:0 "Lizardfolk Regulars"
 dodd_lizardkin_regulars_desc:0 "Our military is evermore reliant on the lizardfolk, mercenaries in essentially permanent employ. Let us turn these 'irregulars' into regulars to streamline our military administration and build a more cohesive army. Though it may upset some of the gnomes in our military."
 dodd_draining_the_swamp_title:0 "wip"
 dodd_draining_the_swamp_desc:0 "wip"
 dodd_the_three_polders_title:0 "The three polders"
 dodd_the_three_polders_desc:0 "There are 3 lizardfolk tribes that formed some of our earliest allies as well as the main pillars of our military force. They have become our subjects under the polder system, lending them the name of the three polders."
 dodd_the_five_polders_title:0 "The five polders"
 dodd_the_five_polders_desc:0 "Three main polders no longer sufficies for the needs of our hierarchy, naturally we could expand our current polders but we rather have more polders that can further specialize, for efficiency reasons of course."
 dodd_conquer_qasri_abeesooyinka_title:0 "Conquer Qasri Abeesooyinka"
 dodd_conquer_qasri_abeesooyinka_desc:0 "The great harbour of Qasri Abeesooyinka is right there, just across the straits, being a threat to us, as well as an oppertunity to strengthen our fleets and hierarchy. Besides it will form an excellent starting point for expeditions eastward."
 dodd_expedition_into_jasiir_doog_title:0 "Expedition into jasiir doog"
 dodd_expedition_into_jasiir_doog_desc:0 "Our artificers have taken great interest in the stories of genie kingdoms in the lands once known as the jasiir doog. Let us organize an expedition to find out what is true about these tales."
 dodd_taychend_title:0 "Taychend"
 dodd_taychend_desc:0 "wip"
 dodd_amadia_title:0 "Amadia"
 dodd_amadia_desc:0 "wip"
 dodd_tightening_the_bonds_title:0 "Tightening the bonds"
 dodd_tightening_the_bonds_desc:0 "Our hierarchy's foundation is the polder model wherin the gnomes produce high quality goods in exchange for lizardfolk labour. Tensions between these two groups however do persist and it is time for reforms to lessen said tensions."
 dodd_subjugate_the_mashkay_and_skarakara_title:0 "Subjugate the Mashkya and Skarakara"
 dodd_subjugate_the_mashkay_and_skarakara_desc:0 "Let us put the Mashkya and Skarakara lizardfolk under the authority of our polder."
 dodd_conquer_zulbur_and_ishyaga_title:0 "Zulbur and Ishyaga"
 dodd_conquer_zulbur_and_ishyaga_desc:0 "wip"
 dodd_conquer_the_rakaty_islands_title:0 "Conquer the Rankaty islands"
 dodd_conquer_the_rakaty_islands_desc:0 "West of the Doddcodds are the Rankaty islands. They are relatively unpopulated and have but limited natural resources, they are however of great strategic value, both for trade and for any westward and northward expeditions."
 dodd_eastern_effelai_title:0 "Eastern Effelai"
 dodd_eastern_effelai_desc:0 "wip"
 dodd_further_into_effelai_title:0 "further into the Effelai"
 dodd_further_into_effelai_desc:0 "wip"
 dodd_deep_effelai_development_title:0 "Deep effelai development"
 dodd_deep_effelai_development_desc:0 "wip"
 dodd_develop_amadia_title:0 "Develop amadia"
 dodd_develop_amadia_desc:0 "wip"
 dodd_mushrooms_title:0 "The Shroom woods"
 dodd_mushrooms_desc:0 "wip"
 dodd_tree_plantations1_title:0 "Forcefully build tree plantations"
 dodd_tree_plantations1_desc:0 "We need tree plantations for lumber for our fleets, whether the local lizardfolk like it or not."
 dodd_tree_plantations2_title:0 "Co-operatively build tree plantations"
 dodd_tree_plantations2_desc:0 "We need tree plantations for lumber for our fleets, working together with local lizardfolk may prove useful to this end."
 dodd_tree_plantations3_title:0 "Forcefully build tree plantations in polder"
 dodd_tree_plantations3_desc:0 "We need tree plantations for lumber for our fleets, whether the lizardfolk of our polder like it or not"
 dodd_tree_plantations4_title:0 "Co-operatively build tree plantations in polder"
 dodd_tree_plantations4_desc:0 "We need tree plantations for lumber for our fleets, working together within the polder may prove useful to this end."
 dodd_recruit_irregulars_title:0 "Recruit irregulars"
 dodd_recruit_irregulars_desc:0 "Recruit irregulars from the polder."
 dodd_asign_fourth_polder_title:0 "Assign fourth polder"
 dodd_asign_fourth_polder_desc:0 "We need a fourth polder, lets grant one of our subjects the position officially."
 dodd_asign_fifth_polder_title:0 "Assign fifth polder"
 dodd_asign_fifth_polder_desc:0 "We need a fifth polder, lets grant one of our subjects the position officially."
 dodd_build_dykes_title:0 "Build dykes"
 dodd_build_dykes_desc:0 "Build dykes in our marshes to prevent flooding and to facilitate water draining."
 dodd_install_pumps_title:0 "Install pumps"
 dodd_install_pumps_desc:0 "Install pumps at our dykes to drain water from our marshy land."
 dodd_fertilizer_imports_title:0 "Import ash fertilizer"
 dodd_fertilizer_imports_desc:0 "Import fertilizer from the burning effelai."
 dodd_fertilizer_production_title:0 "Produce ash fertilizer"
 dodd_fertilizer_production_desc:0 "Cut down massive amounts of tree to burn into fertilizer."
 dodd_permanent_fertilizer_production_title:0 "Artificial fertilizer production"
 dodd_permanent_fertilizer_production_desc:0 "Our artificers belief that with additional funding they can figure out a method to create fertilizer without cutting down any more tree's."
 dodd_move_in_vyzembi_farmers_title:0 "Move in Vyzembi farmers"
 dodd_move_in_vyzembi_farmers_desc:0 "Move Vyzembi farmers into the newly reclaimed land to farm."
 dodd_dyke_checker_title:0 "Dyke checker"
 dodd_pump_checker_title:0 "Pump checker"
